[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

; Ces deux lignes activent le hack multicanal dans tout ton projet
; On configure l'USB Audio pour 2 canaux en entrée et 2 en sortie.
build_flags = 
    -D USB_AUDIO
    -D AUDIO_USB_INPUT_CHANNELS=6
    -D AUDIO_USB_OUTPUT_CHANNELS=6
    -D AUDIO_SUBSLOT_SIZE=2
    #-D AUDIO_SAMPLE_RATE_EXACT=48000.0f
    #-D AUDIO_SAMPLE_RATE_I=48000
    #-D AUDIO_USB_CHANNEL_COUNT=6